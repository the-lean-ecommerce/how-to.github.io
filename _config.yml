title: The Lean Ecommerce How-To
description: Clear technical guides for ecommerce operators, SaaS builders, and automation-minded teams.
url: "https://how-to.the-lean-ecommerce.com"
baseurl: ""
github_repo_url: "https://github.com/the-lean-ecommerce/how-to.github.io"

permalink: /:year/:month/:day/:title/

markdown: kramdown
paginate: 30
paginate_path: "/page:num/"

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "The Lean Ecommerce"
